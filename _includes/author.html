<div class="author">
  <img
    class="author-avatar"
    src="{{ site.author.avatar }}"
    alt="{{ site.author.username }}"
  />
  <h2 class="author-name">{{ site.author.name }}</h2>
  <p class="author-bio">{{ site.author.bio }}</p>
  <div class="author-links">
    <a href="https://x.com/stellakaval" target="_blank" rel="noopener">Twitter</a>
    <span aria-hidden="true">·</span>
    <a href="https://www.linkedin.com/in/stellakaval/" target="_blank" rel="noopener">LinkedIn</a>
  </div>
</div>
